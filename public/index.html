<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Kanban</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="sidebar-head">
          <a class="brand" href="#/" title="AI Kanban">
            <img src="/favicon.svg" alt="" width="20" height="20" />
            <span class="nav-label">AI Kanban</span>
          </a>
          <button id="sidebar-collapse" class="icon-btn sidebar-collapse" type="button" aria-label="Collapse the sidebar" title="Collapse the sidebar">
            <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-panel-left"/></svg>
          </button>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
          <button class="nav-item" type="button" data-view="inbox" title="Inbox: everything waiting on you (G then I)">
            <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-inbox"/></svg>
            <span class="nav-label">Inbox</span><span class="nav-count inbox-count" id="inbox-count" hidden></span>
          </button>

          <div class="nav-section" id="projects-section">
            <span class="nav-label">Projects</span>
            <button id="new-project" class="icon-btn small" type="button" aria-label="New project" title="New project">
              <svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="/icons.svg#i-plus"/></svg>
            </button>
          </div>
          <ul class="project-list" id="project-list"></ul>

          <!-- The current project's views; renderSidebar() moves this under the current project. -->
          <ul class="nav-sub" id="view-nav">
            <li><button class="nav-item" type="button" data-view="board" title="Board (G then B)">
              <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-square-kanban"/></svg><span class="nav-label">Board</span></button></li>
            <li><button class="nav-item" type="button" data-view="plan" title="Plan (G then P)">
              <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-calendar-range"/></svg><span class="nav-label">Plan</span></button></li>
            <li><button class="nav-item" type="button" data-view="review" title="Review (G then R)">
              <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-eye"/></svg><span class="nav-label">Review</span><span class="nav-count" id="review-count" hidden></span></button></li>
          </ul>
        </nav>

        <div class="sidebar-foot">
          <a id="capture-link" class="nav-item" href="/capture" target="_blank" rel="noopener" title="Capture: quick notes and screenshots from your phone">
            <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-smartphone"/></svg><span class="nav-label">Capture</span></a>
          <button id="activity-toggle" class="nav-item" type="button" aria-pressed="false" title="Activity">
            <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-activity"/></svg><span class="nav-label">Activity</span></button>
          <button id="project-settings" class="nav-item" type="button" title="Project settings">
            <svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-settings"/></svg><span class="nav-label">Project settings</span></button>
          <div class="sidebar-user">
            <label class="me" title="Your name, recorded on changes you make">
              <span class="me-avatar" id="me-avatar" aria-hidden="true"></span>
              <input id="me" spellcheck="false" autocomplete="off" aria-label="Your name" />
            </label>
            <span id="live" class="live" title="Connecting…"></span>
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Theme"></button>
          </div>
          <button id="director-mode" class="director-mode" type="button" hidden></button>
        </div>
      </aside>
      <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

      <div class="main-col">
        <header class="topbar">
          <button id="drawer-toggle" class="icon-btn drawer-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
            <svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="/icons.svg#i-menu"/></svg>
          </button>
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <span id="crumb-project" class="crumb-project"></span>
            <svg class="icon crumb-sep" width="14" height="14" aria-hidden="true" focusable="false"><use href="/icons.svg#i-chevron-right"/></svg>
            <span id="crumb-view" class="crumb-view" aria-current="page"></span>
          </nav>
          <div class="filters" id="filters">
            <label class="search">
              <svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="/icons.svg#i-search"/></svg>
              <input id="search" type="search" placeholder="Search  /" aria-label="Search tasks" aria-keyshortcuts="/" />
            </label>
            <div class="filter-menu">
              <button id="filter-button" class="btn btn-ghost" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="filter-popover" aria-label="Filters"><svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="/icons.svg#i-list-filter"/></svg><span class="btn-label">Filters</span><span id="filter-count" class="filter-count" hidden></span></button>
              <div id="filter-popover" class="popover filter-popover" role="dialog" aria-label="Filters" hidden>
                <div id="filter-fields" class="filter-fields"></div>
                <div class="actions"><button id="filter-clear" class="btn btn-ghost" type="button">Clear</button></div>
              </div>
            </div>
          </div>
          <div class="view-actions" id="view-actions"></div>
        </header>

        <div id="filter-chips" class="filter-chips" hidden></div>
        <nav id="status-switcher" class="status-switcher" aria-label="Board columns" hidden></nav>

        <main class="layout">
          <div id="board" class="board"></div>
          <div id="plan" class="plan" hidden></div>
          <div id="review" class="review" hidden></div>
          <div id="inbox" class="review inbox" hidden></div>
          <aside id="activity" class="activity-panel" hidden>
            <div class="panel-head">
              <h2>Activity</h2>
              <button class="icon-btn" id="activity-close" aria-label="Close activity"><svg class="icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/icons.svg#i-x"/></svg></button>
            </div>
            <ol id="activity-list" class="activity-list"></ol>
          </aside>
        </main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
